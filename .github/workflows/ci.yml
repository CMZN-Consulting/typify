name: ci

on:
  push:
    branches: [main, v1, v1-stage2, v1-stage3]
  pull_request:

permissions:
  contents: read

env:
  TYPIFY_BLIND_MODE: full
  TYPIFY_ACCEPTANCE_STAGE: "3"
  TYPIFY_GBNF_VALIDATOR_REVISION: fd27b2034905f8dadd8bd6d2cc44595f4929d391

jobs:
  kernel:
    name: Kernel checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      blind-mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Select frozen replay mode
        id: mode
        shell: bash
        run: |
          case "$TYPIFY_BLIND_MODE" in
            deferred|full) printf 'mode=%s\n' "$TYPIFY_BLIND_MODE" >> "$GITHUB_OUTPUT" ;;
            *) printf 'Unknown frozen replay mode\n' >&2; exit 2 ;;
          esac
          printf 'Frozen corpus replay: %s. Deferred mode does not claim acceptance.\n' "$TYPIFY_BLIND_MODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Racket 9.3 CS
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.racket-lang.org/releases/9.3/installers/racket-9.3-x86_64-linux-buster.sh \
            --output "$RUNNER_TEMP/racket-installer.sh"
          printf '%s  %s\n' \
            30dc59d9b5af083eacf793253d35782c5231e8bfb7a7331fe32ccd9a41fd792f \
            "$RUNNER_TEMP/racket-installer.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/racket-installer.sh" --create-dir --in-place --dest "$RUNNER_TEMP/racket"
          printf '%s\n' "$RUNNER_TEMP/racket/bin" >> "$GITHUB_PATH"
      - name: Link source package without fetching dependencies
        run: raco pkg install --scope user --no-setup --deps fail --name typify --link ./src
      - name: Build pinned independent grammar validator
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git init "$RUNNER_TEMP/decoder-source"
          git -C "$RUNNER_TEMP/decoder-source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/decoder-source" fetch --depth 1 origin "$TYPIFY_GBNF_VALIDATOR_REVISION"
          git -C "$RUNNER_TEMP/decoder-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/decoder-source" rev-parse HEAD)" = "$TYPIFY_GBNF_VALIDATOR_REVISION"
          cmake -S "$RUNNER_TEMP/decoder-source" -B "$RUNNER_TEMP/decoder-build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_COMMON=ON -DLLAMA_BUILD_TESTS=ON -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_UI=OFF -DLLAMA_CONNECT=OFF -DLLAMA_OPENSSL=OFF \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_CUDA=OFF -DGGML_BLAS=OFF
          cmake --build "$RUNNER_TEMP/decoder-build" --target test-gbnf-validator --parallel 4
          printf 'TYPIFY_GBNF_VALIDATOR=%s\n' "$RUNNER_TEMP/decoder-build/bin/test-gbnf-validator" >> "$GITHUB_ENV"
      - name: Measure internal kernel checks without frozen corpus replay
        run: racket scripts/ci.rkt --group kernel --stage "$TYPIFY_ACCEPTANCE_STAGE" --defer-blind --output "${{ runner.temp }}/kernel-check.json"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "latest"
      - name: Check the authoring server through an MCP client
        working-directory: mcp
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kernel-check
          path: ${{ runner.temp }}/kernel-check.json
          if-no-files-found: error
          retention-days: 30

  language-replay:
    name: Frozen language replay
    needs: kernel
    if: ${{ always() && needs.kernel.outputs.blind-mode == 'full' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Racket 9.3 CS
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.racket-lang.org/releases/9.3/installers/racket-9.3-x86_64-linux-buster.sh \
            --output "$RUNNER_TEMP/racket-installer.sh"
          printf '%s  %s\n' \
            30dc59d9b5af083eacf793253d35782c5231e8bfb7a7331fe32ccd9a41fd792f \
            "$RUNNER_TEMP/racket-installer.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/racket-installer.sh" --create-dir --in-place --dest "$RUNNER_TEMP/racket"
          printf '%s\n' "$RUNNER_TEMP/racket/bin" >> "$GITHUB_PATH"
      - name: Replay language verdicts, declarations and witnesses
        run: racket scripts/ci.rkt --group language --stage "$TYPIFY_ACCEPTANCE_STAGE" --output "${{ runner.temp }}/language-replay.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: language-replay
          path: ${{ runner.temp }}/language-replay.json
          if-no-files-found: error
          retention-days: 30

  mutation-replay:
    name: Frozen mutation replay
    needs: kernel
    if: ${{ always() && needs.kernel.outputs.blind-mode == 'full' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Racket 9.3 CS
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.racket-lang.org/releases/9.3/installers/racket-9.3-x86_64-linux-buster.sh \
            --output "$RUNNER_TEMP/racket-installer.sh"
          printf '%s  %s\n' \
            30dc59d9b5af083eacf793253d35782c5231e8bfb7a7331fe32ccd9a41fd792f \
            "$RUNNER_TEMP/racket-installer.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/racket-installer.sh" --create-dir --in-place --dest "$RUNNER_TEMP/racket"
          printf '%s\n' "$RUNNER_TEMP/racket/bin" >> "$GITHUB_PATH"
      - name: Replay the unchanged mutation operator set and independent oracles
        run: racket scripts/ci.rkt --group mutation --stage "$TYPIFY_ACCEPTANCE_STAGE" --output "${{ runner.temp }}/mutation-replay.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mutation-replay
          path: ${{ runner.temp }}/mutation-replay.json
          if-no-files-found: error
          retention-days: 30

  lean:
    name: Lean / zero sorry
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Racket 9.3 CS
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.racket-lang.org/releases/9.3/installers/racket-9.3-x86_64-linux-buster.sh \
            --output "$RUNNER_TEMP/racket-installer.sh"
          printf '%s  %s\n' \
            30dc59d9b5af083eacf793253d35782c5231e8bfb7a7331fe32ccd9a41fd792f \
            "$RUNNER_TEMP/racket-installer.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/racket-installer.sh" --create-dir --in-place --dest "$RUNNER_TEMP/racket"
          printf '%s\n' "$RUNNER_TEMP/racket/bin" >> "$GITHUB_PATH"
      - name: Link source package without fetching dependencies
        run: raco pkg install --scope user --no-setup --deps fail --name typify --link ./src
      - name: Install verified Lean 4.36.0
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/leanprover/lean4/releases/download/v4.36.0/lean-4.36.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean-4.36.0-linux.tar.zst"
          printf '%s  %s\n' \
            2b7ab1ed8b92d2e6abfaf41344823b510064dbc9c0260cac73eb496ab2dea6eb \
            "$RUNNER_TEMP/lean-4.36.0-linux.tar.zst" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/lean4"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/lean-4.36.0-linux.tar.zst" \
            -C "$RUNNER_TEMP/lean4" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/lean4/bin" >> "$GITHUB_PATH"
      - name: Compile every tracked Lean module, audit axioms and run conformance
        shell: bash
        run: |
          python3 -B scripts/metalogic-check.py --mode ci --repo-dir . \
            --source-ref "${{ github.sha }}" --lean-bin "$RUNNER_TEMP/lean4/bin" \
            --output "$RUNNER_TEMP/lean-zero-sorry.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lean-zero-sorry
          path: ${{ runner.temp }}/lean-zero-sorry.json
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Acceptance
    needs: [kernel, language-replay, mutation-replay, lean]
    if: ${{ always() && needs.kernel.outputs.blind-mode == 'full' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install verified Racket 9.3 CS
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://download.racket-lang.org/releases/9.3/installers/racket-9.3-x86_64-linux-buster.sh \
            --output "$RUNNER_TEMP/racket-installer.sh"
          printf '%s  %s\n' \
            30dc59d9b5af083eacf793253d35782c5231e8bfb7a7331fe32ccd9a41fd792f \
            "$RUNNER_TEMP/racket-installer.sh" | sha256sum --check --strict
          sh "$RUNNER_TEMP/racket-installer.sh" --create-dir --in-place --dest "$RUNNER_TEMP/racket"
          printf '%s\n' "$RUNNER_TEMP/racket/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kernel-check
          path: ${{ runner.temp }}/evidence/kernel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: language-replay
          path: ${{ runner.temp }}/evidence/language
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mutation-replay
          path: ${{ runner.temp }}/evidence/mutation
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lean-zero-sorry
          path: ${{ runner.temp }}/evidence/lean
      - name: Require passing Lean / zero sorry receipt for this commit
        if: always()
        shell: python
        env:
          LEAN_RESULT: ${{ needs.lean.result }}
        run: |
          import json, os
          from pathlib import Path
          doc = json.loads(Path(os.environ["RUNNER_TEMP"], "evidence/lean/lean-zero-sorry.json").read_text(encoding="utf-8"))
          if (
              os.environ.get("LEAN_RESULT") != "success"
              or doc.get("pass") is not True
              or doc.get("sourceCommit") != os.environ.get("GITHUB_SHA")
              or len(doc.get("laws", [])) != 3
          ):
              raise SystemExit("Refusing acceptance without a green Lean / zero sorry receipt on GITHUB_SHA")
      - name: Require complete evidence and every registered gate for the selected stage
        if: always()
        run: |
          racket scripts/ci.rkt --stage "$TYPIFY_ACCEPTANCE_STAGE" --aggregate \
            "${{ runner.temp }}/evidence/kernel/kernel-check.json" \
            "${{ runner.temp }}/evidence/language/language-replay.json" \
            "${{ runner.temp }}/evidence/mutation/mutation-replay.json" \
            --output "${{ runner.temp }}/acceptance.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: acceptance
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error
          retention-days: 30
